[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docextract"
version = "0.1.0"
description = "Receipt field extraction with a LoRA-tuned small language model (Avathon challenge, Track B / S2)"
requires-python = ">=3.10"
# Runtime deps live in requirements.txt; install with: pip install -r requirements.txt && pip install -e . --no-deps
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
